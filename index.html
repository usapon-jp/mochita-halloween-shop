<canvas id="c" aria-label="もちたの小さな雑貨とおやつのお店の3D箱庭"></canvas>
<div id="ui">

  <div id="tools">
    <button id="photo" aria-label="写真をとる" title="写真をとる (P)"><svg class="ic" aria-hidden="true"><use href="#ic-camera"/></svg></button>

  </div>
  <nav id="shots" aria-label="カメラ切り替え">
    <button data-shot="counter" class="on"><svg class="ic" aria-hidden="true"><use href="#ic-cup"/></svg><span>カウンター</span></button>
    <button data-shot="overview"><svg class="ic" aria-hidden="true"><use href="#ic-house"/></svg><span>全景</span></button>
    <button data-shot="window"><svg class="ic" aria-hidden="true"><use href="#ic-window"/></svg><span>窓辺</span></button>
    <button data-shot="closeup"><svg class="ic" aria-hidden="true"><use href="#ic-jar"/></svg><span>小物</span></button>
    <button id="auto" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#ic-star"/></svg><span>おまかせ</span></button>
