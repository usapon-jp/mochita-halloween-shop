<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もちたの小さな雑貨とおやつのお店</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="c" aria-label="もちたの小さな雑貨とおやつのお店の3D箱庭"></canvas>
<div id="ui">
  <h1>もちたの小さな雑貨とおやつのお店</h1>
  <p id="tip">画面をタップ → もちたが歩いてくるよ<br><small>ドラッグで回す ・ ピンチで拡大 ・ 📷で写真</small></p>
  <div id="tools">
    <button id="photo" aria-label="写真をとる" title="写真をとる (P)">📷</button>
    <button id="info" aria-label="クレジット" title="クレジット">ⓘ</button>
    <button id="eye" aria-label="UIを隠す" title="UIを隠す (H)">👁</button>
  </div>
  <nav id="shots" aria-label="カメラ切り替え">
    <button data-shot="counter" class="on">カウンター</button>
    <button data-shot="overview">全景</button>
    <button data-shot="window">窓辺</button>
    <button data-shot="closeup">小物</button>
    <button id="auto" aria-pressed="false">おまかせ</button>
  </nav>
  <aside id="credit" hidden>
    <b>クレジット</b>
    <p>キャラクター：もちた<br>3D原型：<a href="https://www.meshy.ai/" target="_blank" rel="noopener">Meshy</a>で画像から生成（<a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener">CC BY 4.0</a>）。造形・着色・立ち姿・歩行・軽量化を改変。<br>Three.js (MIT)</p>
    <small>タップで閉じる</small>
  </aside>
</div>
<button id="reveal" aria-label="UIを表示"></button>
<div id="flash"></div><div id="toast"></div>
<div id="fallback" hidden>3Dを表示できませんでした。WebGL対応のブラウザで開いてください。</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
